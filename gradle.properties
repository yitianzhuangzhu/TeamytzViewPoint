# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
#
# net.minecraftforge.gradle.test_certs=false：关掉 ForgeGradle 启动时对
# https://libraries.minecraft.net/ 的证书自检。该自检在本机会误报
#   "Failed to validate certificate for https://libraries.minecraft.net/, Most likely cause is an outdated JDK"
# （实测同一台机器、同一个 JDK 下用 .NET/Write 访问该域名 TLS 完全正常，根路径返回 404 是正常的，
#  说明是 ForgeGradle 自己的探测逻辑误判，不是真的证书或网络问题）。
#
# 为什么必须写在这里而不是命令行：这条属性由 ForgeGradle 的 Utils 静态块用
# System.getProperty 读取，而 ForgeGradle 跑在 Gradle fork 出来的构建 JVM 里 ——
# 命令行 `-D...` 只作用于 launcher JVM，传不进去，org.gradle.jvmargs 才会传给 fork 的 JVM。
#
# 关掉自检不影响真正的下载：实际下载仍走 JVM 自带信任库校验，不是"跳过所有证书验证"。
# 该开关只跳过启动时那一次 HEAD 探测。
org.gradle.jvmargs=-Xmx3G -Dnet.minecraftforge.gradle.test_certs=false
org.gradle.daemon=false